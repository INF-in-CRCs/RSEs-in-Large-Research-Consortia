name: 'spellcheck'
on: [push, pull_request]
jobs:
  spellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Install aspell
        run: |
          sudo apt-get update
          sudo apt-get install -y aspell aspell-en
      - name: Run spellchecker (non-blocking)
        continue-on-error: true
        run: bash spellcheck.sh workshop-report/report.tex
